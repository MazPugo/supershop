AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Supershop static website - S3 + CloudFront + WAF (SQL injection protection).
  NOTE: Must be deployed in us-east-1 because WAF WebACLs for CloudFront must be in us-east-1.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique S3 bucket name for the website
    Default: supershop-mazpugo

  GitHubOrg:
    Type: String
    Description: GitHub organisation or user name (e.g. myorg)

  GitHubRepo:
    Type: String
    Description: GitHub repository name (e.g. supershop)

  DomainName:
    Type: String
    Description: Custom domain name for the website
    Default: supershopco.uk

  AcmCertificateArn:
    Type: String
    Description: ARN of the ACM certificate for the domain (must be in us-east-1 for CloudFront)
    Default: arn:aws:acm:us-east-1:849354443079:certificate/9171ffa3-86b4-4f45-8122-4cbeccc6b038

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 hosted zone ID for the domain

Resources:

  # S3 Bucket (private, no public access)
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      AccelerateConfiguration:
        AccelerationStatus: Enabled
      MetricsConfigurations:
        - Id: EntireBucket
      ReplicationConfiguration:
        Role: !GetAtt S3ReplicationRole.Arn
        Rules:
          - Id: ReplicateAllToEuWest2
            Priority: 1
            Status: Enabled
            Filter:
              Prefix: ''
            Destination:
              Bucket: !Sub 'arn:aws:s3:::${BucketName}-dr'
              StorageClass: STANDARD
            DeleteMarkerReplication:
              Status: Enabled

  # WAF Web ACL (CLOUDFRONT scope, must be us-east-1)
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${BucketName}-waf'
      Scope: CLOUDFRONT
      Description: WAF for Supershop CloudFront - SQL injection protection
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${BucketName}-waf-metric'
      Rules:
        - Name: AWSManagedRulesSQLiRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesSQLiRuleSet
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesKnownBadInputsRuleSet

  # S3 Bucket for product images (private, no public access)
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketName}-images'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      AccelerateConfiguration:
        AccelerationStatus: Enabled
      ReplicationConfiguration:
        Role: !GetAtt S3ReplicationRole.Arn
        Rules:
          - Id: ReplicateImagesToEuWest2
            Priority: 1
            Status: Enabled
            Filter:
              Prefix: ''
            Destination:
              Bucket: !Sub 'arn:aws:s3:::${BucketName}-images-dr'
              StorageClass: STANDARD
            DeleteMarkerReplication:
              Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ImagesLifecycleRule
            Status: Enabled
            Transitions:
              - TransitionInDays: 60
                StorageClass: STANDARD_IA
              - TransitionInDays: 180
                StorageClass: GLACIER

  # Origin Access Control for the images bucket
  ImagesOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${BucketName}-images-oac'
        Description: OAC for Supershop product images S3 bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Origin Access Control
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${BucketName}-oac'
        Description: OAC for Supershop S3 bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Comment: Supershop website distribution
        WebACLId: !GetAtt WebACL.Arn
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: ImagesOrigin
            DomainName: !GetAtt ImagesBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ImagesOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        CacheBehaviors:
          - PathPattern: /images/*
            TargetOriginId: ImagesOrigin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        HttpVersion: http2
        IPV6Enabled: true

  # CloudWatch Dashboard
  SupershopDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${BucketName}-dashboard'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 1,
              "properties": {
                "markdown": "# Supershop Website Dashboard"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 1, "width": 12, "height": 6,
              "properties": {
                "title": "CloudFront - Total Requests",
                "view": "timeSeries",
                "stacked": false,
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [ "AWS/CloudFront", "Requests", "DistributionId", "${CloudFrontDistribution}", "Region", "Global" ]
                ],
                "region": "us-east-1"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 1, "width": 12, "height": 6,
              "properties": {
                "title": "CloudFront - 4xx and 5xx Error Rate",
                "view": "timeSeries",
                "stacked": false,
                "stat": "Average",
                "period": 300,
                "metrics": [
                  [ "AWS/CloudFront", "4xxErrorRate", "DistributionId", "${CloudFrontDistribution}", "Region", "Global" ],
                  [ "AWS/CloudFront", "5xxErrorRate", "DistributionId", "${CloudFrontDistribution}", "Region", "Global" ]
                ],
                "region": "us-east-1"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 7, "width": 12, "height": 6,
              "properties": {
                "title": "S3 - All Requests",
                "view": "timeSeries",
                "stacked": false,
                "stat": "Sum",
                "period": 86400,
                "metrics": [
                  [ "AWS/S3", "AllRequests", "BucketName", "${BucketName}", "FilterId", "EntireBucket" ]
                ],
                "region": "us-east-1"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 7, "width": 12, "height": 6,
              "properties": {
                "title": "CloudFront - Bytes Downloaded",
                "view": "timeSeries",
                "stacked": false,
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [ "AWS/CloudFront", "BytesDownloaded", "DistributionId", "${CloudFrontDistribution}", "Region", "Global" ]
                ],
                "region": "us-east-1"
              }
            }
          ]
        }


  # IAM Role for S3 Cross-Region Replication
  S3ReplicationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${BucketName}-s3-replication-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3ReplicationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read from source buckets
              - Sid: SourceBucketRead
                Effect: Allow
                Action:
                  - s3:GetReplicationConfiguration
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${BucketName}'
                  - !Sub 'arn:aws:s3:::${BucketName}-images'
              # Read objects from source buckets
              - Sid: SourceObjectRead
                Effect: Allow
                Action:
                  - s3:GetObjectVersionForReplication
                  - s3:GetObjectVersionAcl
                  - s3:GetObjectVersionTagging
                Resource:
                  - !Sub 'arn:aws:s3:::${BucketName}/*'
                  - !Sub 'arn:aws:s3:::${BucketName}-images/*'
              # Write objects to destination buckets
              - Sid: DestinationObjectWrite
                Effect: Allow
                Action:
                  - s3:ReplicateObject
                  - s3:ReplicateDelete
                  - s3:ReplicateTags
                Resource:
                  - !Sub 'arn:aws:s3:::${BucketName}-dr/*'
                  - !Sub 'arn:aws:s3:::${BucketName}-images-dr/*'

  # GitHub Actions OIDC Identity Provider (one per AWS account)
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${BucketName}-github-deploy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOIDCProvider.Arn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # Matches any branch ref in this repo
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/*'
      Policies:
        - PolicyName: S3DeployPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3PutObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: !Sub 'arn:aws:s3:::${BucketName}/*'
        - PolicyName: CloudFrontInvalidationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFrontInvalidate
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # Route 53 A/Alias record pointing at the CloudFront distribution
  WebsiteDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        # Z2FDTNDATAQYW2 is the fixed global hosted zone ID for all CloudFront distributions
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

  # Bucket Policy (allow only CloudFront via OAC)
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${BucketName}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub >-
                  arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  # Images Bucket Policy (allow only CloudFront via OAC)
  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontImagesOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${BucketName}-images/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub >-
                  arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

Outputs:
  S3ReplicationRoleArn:
    Description: IAM Role ARN used for S3 Cross-Region Replication
    Value: !GetAtt S3ReplicationRole.Arn

  WebsiteBucketDRName:
    Description: DR destination bucket name for the website (eu-west-2)
    Value: !Sub '${BucketName}-dr'

  ImagesBucketDRName:
    Description: DR destination bucket name for product images (eu-west-2)
    Value: !Sub '${BucketName}-images-dr'

  GitHubActionsRoleArn:
    Description: IAM Role ARN for GitHub Actions OIDC — set as GHA_ROLE_ARN secret
    Value: !GetAtt GitHubActionsDeployRole.Arn

  DashboardURL:
    Description: CloudWatch Dashboard URL
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=us-east-1#dashboards:name=${BucketName}-dashboard'

  CloudFrontURL:
    Description: CloudFront distribution URL
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  WebsiteURL:
    Description: Custom domain website URL
    Value: !Sub 'https://${DomainName}'

  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref CloudFrontDistribution

  WebACLArn:
    Description: WAF Web ACL ARN
    Value: !GetAtt WebACL.Arn

  ImagesBucketName:
    Description: Name of the S3 bucket for product images
    Value: !Ref ImagesBucket

  BucketName:
    Description: Name of the S3 bucket
    Value: !Ref WebsiteBucket
